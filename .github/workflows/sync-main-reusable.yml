name: Synchronize deployed main history
on:
  workflow_call:
    inputs:
      implementation-ref:
        type: string
        required: true
      source-workflow:
        type: string
        default: ci.yml
      source-run-id:
        type: string
        default: ''
      source-sha:
        type: string
        default: ''
      require-receipt:
        type: boolean
        default: false
      find-production-run:
        type: boolean
        default: false
    outputs:
      state:
        description: Verified result; awaiting_checks is queued native auto-merge, not a merged PR.
        value: ${{ jobs.synchronize.outputs.state }}
      pull-request-url:
        value: ${{ jobs.synchronize.outputs.pull_request_url }}
      head-sha:
        value: ${{ jobs.synchronize.outputs.head_sha }}
      ci-run-id:
        value: ${{ jobs.synchronize.outputs.ci_run_id }}
    secrets:
      sync-token:
        required: false
permissions:
  contents: read
jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      production_sha: ${{ steps.synchronize.outputs.production_sha }}
      state: ${{ steps.synchronize.outputs.state }}
      pull_request_url: ${{ steps.synchronize.outputs.pull_request_url }}
      head_sha: ${{ steps.synchronize.outputs.head_sha }}
      ci_run_id: ${{ steps.synchronize.outputs.ci_run_id }}
    concurrency:
      group: protected-main-develop-sync-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pwngames/.github
          ref: ${{ inputs.implementation-ref }}
          path: sync-automation
          persist-credentials: false
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          path: repository
          token: ${{ secrets.sync-token || github.token }}
      - name: Queue protected synchronization without waiting for CI completion
        id: synchronize
        env:
          GH_TOKEN: ${{ secrets.sync-token || github.token }}
          SOURCE_WORKFLOW: ${{ inputs.source-workflow }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          FIND_PRODUCTION_RUN: ${{ inputs.find-production-run }}
          REQUIRE_RECEIPT: ${{ inputs.require-receipt }}
        run: |
          arguments=(--workflow "$SOURCE_WORKFLOW" --run-id "$SOURCE_RUN_ID" --sha "$SOURCE_SHA" --auto-merge)
          if [[ "$REQUIRE_RECEIPT" == true ]]; then arguments+=(--receipt); fi
          if [[ "$FIND_PRODUCTION_RUN" == true ]]; then arguments+=(--find-production-run); fi
          python3 sync-automation/automation/sync_main.py "${arguments[@]}"

  verify-history:
    needs: synchronize
    if: needs.synchronize.outputs.state != 'not_applicable' && needs.synchronize.outputs.state != 'superseded'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify develop contains the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SHA: ${{ needs.synchronize.outputs.production_sha }}
          SYNC_STATE: ${{ needs.synchronize.outputs.state }}
          SYNC_PR: ${{ needs.synchronize.outputs.pull_request_url }}
        run: |
          [[ "$PRODUCTION_SHA" =~ ^[0-9a-f]{40}$ ]]
          while true; do
            missing=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PRODUCTION_SHA...develop" --jq '.behind_by')
            if [[ "$missing" == 0 ]]; then
              echo "Verified develop contains deployed commit $PRODUCTION_SHA."
              break
            fi
            if [[ "$SYNC_STATE" != awaiting_checks || $(gh pr view "$SYNC_PR" --json state --jq .state) == CLOSED ]]; then
              echo "::error::develop is missing $PRODUCTION_SHA (sync state $SYNC_STATE, PR $SYNC_PR)."
              exit 1
            fi
            sleep 30
          done
