name: Synchronize production into develop
on:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  synchronize:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    uses: pwngames/.github/.github/workflows/sync-main-reusable.yml@a268091a908f54291488f7e6c59f4c4d58996fb7
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    with:
      implementation-ref: a268091a908f54291488f7e6c59f4c4d58996fb7
      find-production-run: ${{ github.event_name == 'push' && github.ref_name == 'develop' }}
      source-sha: ${{ github.sha }}
    secrets:
      sync-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
