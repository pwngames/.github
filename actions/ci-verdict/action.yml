name: Verify CI delivery source verdict
description: Verify a bounded own-run gate verdict before delivery classification.
inputs:
  profile:
    description: Immutable validation toolchain/platform/profile identifier.
    required: true
  validation-context:
    description: Build environment and mode fingerprint; identical only for equivalent validation.
    required: true
  expected-jobs:
    description: JSON array of every heavy job id required by this profile (excluding plan).
    required: true
  required-artifacts:
    description: JSON artifact names that must remain available for exact-tree build reuse.
    default: '[]'
  record-runtime-noop:
    description: Opt in only when verified docs skips this consumer runtime delivery.
    default: 'false'
  workflow-path:
    description: Validation policy workflow path.
    default: .github/workflows/ci.yml
  trusted-workflows:
    description: JSON array of trusted run entrypoints; defaults to workflow-path.
    default: '[]'
  gate-name:
    description: Exact source Actions job name for the required aggregate gate.
    default: ci-gate
  gate-names:
    description: Optional JSON mapping of every trusted entrypoint to its exact gate job name.
    default: '{}'
  implementation-ref:
    description: Same immutable 40-character commit as the action uses reference.
    required: true
  source-run:
    description: Exact completed own CI run that triggered delivery.
    required: true
  source-sha:
    description: Exact push source checked out by the delivery workflow.
    required: true
outputs:
  mode:
    description: Verified source full, docs or reuse mode.
    value: ${{ steps.verdict.outputs.mode }}
  outcome:
    description: no_runtime_change for docs; runtime_validation_required otherwise.
    value: ${{ steps.verdict.outputs.outcome }}
runs:
  using: composite
  steps:
    - id: verdict
      shell: bash
      env:
        CI_SOURCE_RUN: ${{ inputs.source-run }}
        CI_SOURCE_SHA: ${{ inputs.source-sha }}
        CI_ACTION_REF: ${{ github.action_ref }}
        CI_REQUIRED_ARTIFACTS: ${{ inputs.required-artifacts }}
        CI_RECORD_RUNTIME_NOOP: ${{ inputs.record-runtime-noop }}
        CI_PROFILE: ${{ inputs.profile }}
        CI_VALIDATION_CONTEXT: ${{ inputs.validation-context }}
        CI_EXPECTED_JOBS: ${{ inputs.expected-jobs }}
        CI_WORKFLOW_PATH: ${{ inputs.workflow-path }}
        CI_TRUSTED_WORKFLOWS: ${{ inputs.trusted-workflows }}
        CI_GATE_NAMES: ${{ inputs.gate-names }}
        CI_GATE_NAME: ${{ inputs.gate-name }}
        CI_IMPLEMENTATION_REF: ${{ inputs.implementation-ref }}
        GH_TOKEN: ${{ github.token }}
      run: python3 "$GITHUB_ACTION_PATH/../../automation/ci_qualification.py" verdict
    - name: Record explicit runtime noop outcome
      if: steps.verdict.outputs.noop_file != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.verdict.outputs.noop_artifact }}
        path: ${{ steps.verdict.outputs.noop_file }}
        if-no-files-found: error
        retention-days: 14
